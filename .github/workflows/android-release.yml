name: Build OnRoadPriz Signed Android Release (AAB & APK)

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build-android-release:
    name: Build Signed Play Store AAB & APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK (API 35 & 36)
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          if [ ! -w "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$ANDROID_SDK_ROOT"

          SDKMANAGER=""
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ] && [ -w "/usr/local/lib/android/sdk" ]; then
            export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "Downloading Google Android Command-Line Tools..."
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm -f /tmp/cmdtools.zip
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" > android/local.properties

      - name: Install dependencies and sync Capacitor Android project
        run: |
          bun install || npm install --legacy-peer-deps
          npm run build
          npx cap sync android

      - name: Ensure Release Upload Keystore & Signing Config
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/upload-keystore.jks" ]; then
            echo "Restoring upload-keystore.jks..."
            echo "" | base64 -d > android/app/upload-keystore.jks
          fi
          printf "storeFile=upload-keystore.jks\nstorePassword=OnRoadPriz@2026#Prod\nkeyAlias=onroadpriz-upload\nkeyPassword=OnRoadPriz@2026#Prod\n" > android/keystore.properties

      - name: Build Signed Android App Bundle (.aab) & Release APK (.apk)
        working-directory: android
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8/' gradle.properties
          sed -i 's/org.gradle.parallel=false/org.gradle.parallel=true/' gradle.properties
          sed -i 's/org.gradle.workers.max=1/org.gradle.workers.max=4/' gradle.properties
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab | head -n 20
          cp -f app/build/outputs/bundle/release/app-release.aab OnRoadPriz-v1.0.0-release.aab
          cp -f app/build/outputs/apk/release/app-release.apk OnRoadPriz-v1.0.0-release.apk

      - name: Upload Signed Play Store AAB Artifact (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: OnRoadPriz-v1.0.0-PlayStore-AAB
          path: android/OnRoadPriz-v1.0.0-release.aab
          if-no-files-found: error

      - name: Upload Signed Release APK Artifact (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: OnRoadPriz-v1.0.0-Release-APK
          path: android/OnRoadPriz-v1.0.0-release.apk
          if-no-files-found: error

      - name: Upload Release Keystore Backup (.jks)
        uses: actions/upload-artifact@v4
        with:
          name: OnRoadPriz-Upload-Keystore
          path: android/app/upload-keystore.jks
          if-no-files-found: error
